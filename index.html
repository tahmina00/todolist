<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List with Edit</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="text-center mb-4">My Todo List</h2>
        
        <!-- Input and Button Area -->
        <div class="input-group mb-3">
            <input id="task" type="text" class="form-control" placeholder="add your task here">
            <button id="btn" class="btn btn-primary">Add Task</button>
        </div>

        <!-- Task List Area -->
        <ul id="listItems" class="list-group">
            <!-- Dynamic list items will append here -->
        </ul>
    </div>

    <script src="edit.js"></script>
</body>
</html>
